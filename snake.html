<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake</title>
<style>
  html,body{margin:0;height:100%;background:#0e1116;color:#e6edf3;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;}
  #wrap{text-align:center}
  h1{margin:0 0 8px;font-size:20px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7ee787}
  #hud{display:flex;justify-content:space-between;font-size:14px;margin:0 2px 6px;color:#9aa7b4}
  canvas{background:#151a21;border:1px solid #263041;border-radius:8px;display:block;touch-action:none}
  #msg{margin-top:10px;font-size:14px;color:#9aa7b4;min-height:20px}
  kbd{background:#222b36;border:1px solid #33404f;border-radius:4px;padding:1px 5px;font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <h1>Snake</h1>
  <div id="hud"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span></div>
  <canvas id="c" width="480" height="480"></canvas>
  <div id="msg">Arrows or <kbd>WASD</kbd> to move &middot; <kbd>P</kbd> pause &middot; <kbd>R</kbd> restart</div>
</div>
<script>
(function(){
  const CELL = 24, COLS = 20, ROWS = 20;
  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const msgEl   = document.getElementById('msg');

  let snake, dir, nextDir, food, score, best, alive, paused, tickMs, acc, last;

  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  function reset(){
    snake = [{x:9,y:10},{x:8,y:10},{x:7,y:10}];
    dir = {x:1,y:0}; nextDir = {x:1,y:0};
    score = 0; alive = true; paused = false;
    tickMs = 130; acc = 0; last = performance.now();
    placeFood();
    scoreEl.textContent = 0;
    msgEl.innerHTML = 'Arrows or <kbd>WASD</kbd> to move &middot; <kbd>P</kbd> pause &middot; <kbd>R</kbd> restart';
  }

  function placeFood(){
    const free = [];
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(!snake.some(s=>s.x===x&&s.y===y)) free.push({x,y});
    }
    food = free.length ? free[Math.floor(Math.random()*free.length)] : null;
  }

  function step(){
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};

    if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS){ return die(); }
    // tail cell frees up this tick unless we eat
    const eating = food && head.x===food.x && head.y===food.y;
    const body = eating ? snake : snake.slice(0, snake.length-1);
    if(body.some(s=>s.x===head.x&&s.y===head.y)) return die();

    snake.unshift(head);
    if(eating){
      score += 10;
      scoreEl.textContent = score;
      if(score > best){ best = score; bestEl.textContent = best; localStorage.setItem('snakeBest', best); }
      if(tickMs > 60) tickMs -= 4;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function die(){
    alive = false;
    msgEl.textContent = 'Game over — score ' + score + '. Press R or Space to play again.';
  }

  function draw(){
    ctx.clearRect(0,0,cvs.width,cvs.height);
    // grid
    ctx.strokeStyle = '#1b222c'; ctx.lineWidth = 1;
    for(let i=1;i<COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,ROWS*CELL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(COLS*CELL,i*CELL); ctx.stroke();
    }
    // food
    if(food){
      ctx.fillStyle = '#ff7b72';
      ctx.beginPath();
      ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-3, 0, Math.PI*2);
      ctx.fill();
    }
    // snake
    snake.forEach((s,i)=>{
      ctx.fillStyle = i===0 ? '#7ee787' : '#3fb950';
      roundRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, 5);
      ctx.fill();
    });
    if(paused){
      ctx.fillStyle = 'rgba(14,17,22,.7)';
      ctx.fillRect(0,0,cvs.width,cvs.height);
      ctx.fillStyle = '#e6edf3'; ctx.font = '600 28px system-ui'; ctx.textAlign='center';
      ctx.fillText('Paused', cvs.width/2, cvs.height/2);
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function loop(t){
    const dt = t - last; last = t;
    if(alive && !paused){
      acc += dt;
      while(acc >= tickMs){ acc -= tickMs; if(alive) step(); }
    }
    draw();
    requestAnimationFrame(loop);
  }

  function turn(x,y){
    if(!alive) return;
    if(dir.x === -x && dir.y === -y) return; // no 180
    nextDir = {x,y};
  }

  const KEYS = {
    ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0],
    w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
    W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
  };

  window.addEventListener('keydown', e=>{
    if(KEYS[e.key]){ e.preventDefault(); turn(KEYS[e.key][0], KEYS[e.key][1]); return; }
    const k = e.key.toLowerCase();
    if(k==='p'){ if(alive) paused = !paused; }
    if(k==='r' || (k===' ' && !alive)){ e.preventDefault(); reset(); }
  });

  // touch / swipe
  let tsx=0, tsy=0;
  cvs.addEventListener('touchstart', e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
  cvs.addEventListener('touchend', e=>{
    const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
    if(Math.abs(dx)<20 && Math.abs(dy)<20) return;
    if(Math.abs(dx)>Math.abs(dy)) turn(dx>0?1:-1, 0); else turn(0, dy>0?1:-1);
  }, {passive:true});

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
